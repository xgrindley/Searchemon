# Pokemon Restock Monitor config
# setup.ps1 copies this to config.yaml. Everything here can also be changed in
# the control panel (http://127.0.0.1:8765 while the app runs). Saving from the
# panel rewrites config.yaml without these comments; this file keeps them.
# config.yaml holds your webhook and keys, so do not share it.

discord:
  webhooks:
    # Discord: Server Settings > Integrations > Webhooks > New Webhook > pick your
    # restock channel > Copy Webhook URL.
    default: ""
    # Optional channels. online: alerts for things you can order online.
    # in_store: alerts for stock on shelves near you. Each area (below) can also
    # have its own webhook and gets only the stores inside that area.
    online: ""
    in_store: ""
    review: ""       # skipped Pokemon merchandise (t-shirts, model kits) with Accept / Mute links
    ebay: ""         # eBay listings under fair value from low-risk sellers
    # Optional: send a store to its own channel. Anything not listed uses default.
    # target: ""
    # pokemoncenter: ""
  mention_role_id: ""      # optional: role to ping (Developer Mode on, right-click role, Copy ID)
  mention_user_id: ""      # optional: your own user id to ping yourself
  username: "Restock Monitor"

# Where you shop. Stores inside any circle are checked and can alert.
# Distances are straight-line miles from the ZIP's center.
areas:
  - {name: Home, zip: "", radius_miles: 15, webhook: ""}   # webhook: optional channel just for this area
  # - {name: Work, zip: "", radius_miles: 8}

settings:
  alert_on_startup: true       # alert for things already in stock when the app opens
  alert_cooldown_minutes: 30   # do not re-alert the same item/store within this window
  notify_sold_out: false       # also post when an item sells out online
  msrp_tolerance_pct: 5        # allow price up to MSRP + this percent (tax rounding, small bumps)
  retailer_sold_only: true     # skip marketplace/third-party sellers (scalper listings)
  confirm_restocks: true       # look a second time a few seconds later before alerting
  link_delay_seconds: 4        # wait this long (plus up to 50% random) before the next page of the same store
  min_store_qty: 1             # 2 skips stores showing a single unit (often already gone)
  allow_non_english: false     # include Japanese and other-language products
  windows_toast: true          # Windows pop-up notification too
  in_store: true               # check nearby store shelves where the store supports it
  max_search_results: 24
  debug_dump: false            # save raw store responses to data/debug when troubleshooting

# Product types: every listing is sorted into one from its title. Built-in MSRPs
# come from collector price guides (see the user guide). Override any of them,
# or turn a type off so it never alerts. Examples:
product_types: {}
#  etb: {msrp: 49.99, alert: true}
#  booster_pack: {alert: false}

# Optional extra keyword filter for your own searches (and the product list if
# apply_to_watchlist is true). The product-type sorter already drops sleeves,
# plush, video games, lots, repacks and graded cards.
keywords:
  include_any: []
  include_all: []
  exclude: []
  apply_to_watchlist: false

# Optional price caps by title phrase. They win over product-type MSRPs.
price_rules: []
#  - {match: "charizard ultra premium", max_price: 119.99}

# Finding products and stores on its own.
discovery:
  enabled: true
  retailers: [target, bestbuy, walmart, kroger, dicks]   # stores whose catalogs get searched
  queries: ["pokemon trading card game", "pokemon tcg"]
  refresh_hours: 6               # search catalogs again this often
  alert_new_listings: true       # post when a store lists a product for the first time
  cross_store: true              # CVS, GameStop, Costco, etc. also search for the products found at other stores
  cross_per_refresh: 8           # how many of those lookups per store each refresh
  items_per_cycle: {target: 6, bestbuy: 20, kroger: 50, walmart: 0, dicks: 3}
  places: true                   # map nearby stores weekly (store finders + OpenStreetMap)

community:
  reddit: true                   # read new r/PokemonTCGDeals posts every 5 min; a restock post checks matching products at once
  new_sets: true                 # once a day, add the newest set names (from tcgcsv.com) to the store searches
  discord: false                 # also post each community tip to your status channel

network:                         # used by the trial methods direct-ua, direct-proxy and browser-proxy
  user_agents: []                # empty = a built-in list of current desktop browsers
  proxies: []                    # one per line: host:port, host:port:user:pass, http://user:pass@host:port or socks5://host:port
                                 # (most VPNs also give you a SOCKS5 proxy address; SOCKS needs: pip install "requests[socks]")
  vpn_reconnect_command: ""      # set here only (never from the panel). Runs after a store is blocked vpn_after_blocks times
                                 # in a row, at most every vpn_min_minutes. Example: "C:\Program Files\Mullvad VPN\resources\mullvad.exe" reconnect
  vpn_after_blocks: 3
  vpn_min_minutes: 30

ebay:                            # eBay deals and fair market value (Products > eBay deals)
  enabled: false
  app_id: ""                     # optional free key from developer.ebay.com (Production keyset); without it the public search page is read
  cert_id: ""
  interval_minutes: 30
  products_per_check: 4
  queries: []                    # extra eBay searches
  deal_pct: 90                   # a deal costs at most this % of fair value
  alert_max_risk: low            # low | medium | high

captcha:                         # a CAPTCHA-solving service answers CAPTCHAs in the checking browsers instead of waiting for you
  service: ""                    # 2captcha | anticaptcha | capsolver (empty = off)
  api_key: ""
  max_per_day: 30                # never send more than this many in a day
  stores: []                     # only these sites (e.g. cvs.com, amazon.com); empty = any

retailers:
  target:
    enabled: true
    store_ids: []              # optional: only these store numbers count
    interval_seconds: 90
  bestbuy:
    enabled: false             # turn on after you get a free key at developer.bestbuy.com
    api_key: ""
    interval_seconds: 60
  kroger:
    enabled: false             # Kroger, Fred Meyer, Smith's, Ralphs and other Kroger stores
    client_id: ""              # free at developer.kroger.com (create an app, Products scope)
    client_secret: ""
    max_stores: 5              # nearest stores checked; 5 fits the free daily limit
    store_ids: []
    interval_seconds: 300
  # fetch_mode for website-based stores:
  #   auto     plain requests first, real browser once the store blocks them (recommended)
  #   browser  always use the real browser
  #   direct   plain requests only
  walmart:
    enabled: true
    interval_seconds: 180
    fetch_mode: auto
    consumer_id: ""            # optional: Walmart.io (walmart.io) Consumer ID
    private_key_file: ""       # full path to the .pem private key made for Walmart.io (stays on this PC)
    key_version: "1"
    publisher_id: ""           # optional Impact publisher ID
  pokemoncenter: {enabled: true, interval_seconds: 900, fetch_mode: browser, watch_queue: true}
  gamestop: {enabled: true, interval_seconds: 240, fetch_mode: auto}
  costco: {enabled: true, interval_seconds: 300, fetch_mode: auto}
  samsclub: {enabled: true, interval_seconds: 300, fetch_mode: auto}
  barnesandnoble: {enabled: true, interval_seconds: 300, fetch_mode: auto}
  booksamillion: {enabled: true, interval_seconds: 300, fetch_mode: auto}
  amazon: {enabled: true, interval_seconds: 300, fetch_mode: browser}
  dicks: {enabled: true, interval_seconds: 300, fetch_mode: browser}     # Dick's Sporting Goods
  safeway: {enabled: true, interval_seconds: 300, fetch_mode: browser}   # Safeway and other Albertsons stores
  raleys: {enabled: true, interval_seconds: 300, fetch_mode: auto}
  walgreens: {enabled: true, api_key: "", interval_seconds: 240, fetch_mode: auto}   # api_key (developer.walgreens.com) is optional: adds exact store locations only, no stock
  cvs: {enabled: true, interval_seconds: 240, fetch_mode: auto}
  macys: {enabled: true, interval_seconds: 600, fetch_mode: auto}   # finds Pokemon products by itself, in the browser
  kohls: {enabled: true, interval_seconds: 600, fetch_mode: auto}
  web:
    enabled: true              # any other product link
    interval_seconds: 180
    fetch_mode: auto
    # Optional fallback when a page has no structured stock data:
    # in_stock_text: ["add to cart"]
    # out_of_stock_text: ["out of stock", "sold out"]

power:
  low_priority: true           # run quietly in the background so what you are doing gets the CPU first
  keep_awake: false            # true stops Windows sleeping while the app runs (the screen can still turn off)

control_panel:
  enabled: true
  port: 8765
  allow_lan: false             # true lets your phone on home Wi-Fi open it (needs a pin)
  pin: ""                      # 4+ characters, required when allow_lan is true

# When a store blocks plain checks, a real Edge or Chrome window takes over.
browser:
  enabled: true
  channel: msedge              # used when profiles is empty
  # Separate checking browsers, each with its own cookies. Checks rotate across them and a
  # blocked one rests for that store while the others carry on. Restart the app after changing.
  profiles:
    - {name: edge, channel: msedge}
    - {name: chrome, channel: chrome}
    # Attach to a Chrome you started yourself (real signed-in profile). Start it with:
    #   chrome.exe --remote-debugging-port=9222 --user-data-dir="C:\chrome-restock"
    # - {name: my-chrome, cdp_url: "http://127.0.0.1:9222"}
  # Your own Chrome. Run start-my-chrome.ps1: the app notices Chrome on this port (even while it is
  # running) and uses it first for the stores below. Set the port to 0 to turn this off.
  auto_start_own_chrome: true  # the app starts that Chrome (minimized) itself when a store needs it
  own_chrome_port: 9222
  own_chrome_sites: [cvs.com, dickssportinggoods.com, gamestop.com, samsclub.com]
  own_edge_port: 9223        # start-my-edge.ps1; 0 turns it off
  compare_every_minutes: 60  # side-by-side test of every method, only at stores that pushed back lately (hourly at most); 0 = off
  learn_from_compare: true   # checks go first to the methods the side-by-side tests found reliable
  close_own_on_exit: true     # closing the app also closes your own Chrome and Edge windows started by start-my-chrome/edge
  feature_trial: true        # half the checks run without each feature so you can see whether it helps
  page_fetch: true           # retry a refused data request from inside the store's own page
  tabs_per_site: 3             # a store's pages rotate through this many tabs (1 to 6)
  show_window: false           # false keeps it off screen until a store needs you
  headless: false              # headless gets blocked more often; leave false
  ask_me_to_verify: true
  notify_discord: false        # also post "needs a human check" to Discord
  min_interval_seconds: 120

schedule:
  learn_from_history: true     # check faster in hours when a store restocked before
  fast_factor: 0.5
  slow_factor: 3
  min_interval_seconds: 30
  fast_windows: []             # e.g. - {days: [mon, tue, wed, thu, fri], start: "06:00", end: "10:00"}
  slow_windows: []             # e.g. - {days: all, start: "23:00", end: "05:00"}

jitter_seconds: 20

# Specific products. A UPC is enough for Target, Best Buy, Walmart and Kroger.
# Paste links for any other store under urls.
watchlist: []
#  - name: "Mega Evolution Elite Trainer Box"
#    upc: "820650000000"
#    msrp: 49.99
#    urls: ["https://www.pokemoncenter.com/product/...", "https://www.gamestop.com/..."]
#    in_store: true

# Your own keyword searches, on top of automatic discovery.
searches: []
#  - name: "Charizard"
#    query: "pokemon charizard collection"
#    retailers: [target, walmart, bestbuy, kroger]
#    max_price: null
#    in_store: false
